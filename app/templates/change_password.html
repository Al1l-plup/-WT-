<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#161b22">
  <meta name="description" content="WeldTeam MES — смена пароля">
  <title>Смена пароля · WeldTeam MES</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .authbox{max-width:400px;margin:9vh auto;border:1px solid var(--border);border-radius:14px;padding:26px;background:var(--card)}
    .authbox h1{margin:0 0 4px;font-size:22px}
    .authbox p.sub{margin:0 0 18px;opacity:.65;font-size:13px}
    .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
    .fld label{font-size:12px;opacity:.75}
    .fld input{box-sizing:border-box;width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:inherit;font-size:14px}
    .btn{width:100%;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;margin-top:4px}
    .err{background:color-mix(in srgb,#c0392b 15%,transparent);border:1px solid #c0392b;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
    .note{background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
    .alt{text-align:center;margin-top:14px;font-size:13px}
    .alt a{color:var(--accent)}
    @media (max-width: 640px) {
      .authbox { margin: 4vh auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); border-radius: 12px; }
      .fld input { font-size: 16px; min-height: 44px; }
      .btn { min-height: 44px; font-size: 16px; }
    }
  </style>
</head>
<body>
<div class="authbox">
  <h1>Смена пароля</h1>
  <p class="sub">WeldTeam MES · задайте новый пароль для входа</p>
  {% if forced %}<div class="note">Вы вошли по <b>временному паролю</b>. Задайте свой постоянный пароль, чтобы продолжить.</div>{% endif %}
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="fld"><label>Новый пароль (мин. 4)</label><input name="password" type="password" required minlength="4" autofocus autocomplete="new-password"></div>
    <div class="fld"><label>Повтор пароля</label><input name="password2" type="password" required autocomplete="new-password"></div>
    <button class="btn">Сохранить пароль</button>
  </form>
  {% if not forced %}<div class="alt"><a href="/">← На главную</a></div>{% endif %}
</div>
</body>
</html>
