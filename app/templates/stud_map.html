<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#161b22">
  <meta name="description" content="WeldTeam MES — шпильки: карта дефектов (визуализация)">
  <title>Шпильки · Визуализация — WeldTeam MES</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <style>
    /* вкладки — как на странице «Шпильки» (studs.html): там это кнопки, здесь ссылки */
    .sp-tabs{display:flex;gap:6px;margin:0;flex:0 0 auto}
    .sp-tabs a{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font:inherit;font-weight:600;text-decoration:none;white-space:nowrap}
    .sp-tabs a[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
    /* на «Визуализации» вместо заголовка раздела — одна строка: вкладки · источник данных · загрузка */
    .sm-wide{max-width:1600px;margin:0 auto;padding:.75rem 1rem calc(1rem + env(safe-area-inset-bottom))}
    .sm-wide [hidden]{display:none !important}
    .sm-row{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;margin-bottom:.6rem}
    /* кнопка обновления реестра — маленькая, справа; видна только WeldTeam и админу */
    .sm-bar{margin-left:auto;display:flex;align-items:center}
    .sm-bar .btn{white-space:nowrap}
    .sm-msg{font-size:12.5px;margin:-.2rem 0 .6rem;color:var(--text)}
    .sm-msg:empty{display:none}
    .sm-msg.err{color:var(--danger)}
    .sm-frame{display:block;width:100%;height:max(560px,calc(100vh - 128px));border:1px solid var(--border);border-radius:var(--r);background:var(--bg)}
    .sm-empty{padding:2rem;text-align:center;color:var(--muted)}
    /* iPhone и др. без Fullscreen API: карта просит «во весь экран» — окно карты поверх всей страницы */
    .sm-frame.sm-fs{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;z-index:1000;margin:0;border:0;border-radius:0}
    html.sm-fs-on,html.sm-fs-on body{overflow:hidden;overscroll-behavior:none}
    .sm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    @media (max-width:640px){
      .sm-wide{padding:.6rem .5rem calc(1rem + env(safe-area-inset-bottom))}
      .sp-tabs{flex:1 1 100%}
      .sp-tabs a{flex:1;padding:8px 10px;min-height:44px;display:flex;align-items:center;justify-content:center}
      .sp-tabs a:not(:last-child){padding:8px 16px}
      .sm-bar{flex:1 1 100%;justify-content:flex-end}
      .sm-frame{height:max(480px,calc(100vh - 210px))}
    }
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="/">WeldTeam <span>/ цех BS</span></a>
  <div class="nav-links">
    <a class="nav-link" href="/">Главная</a>
    <a class="nav-link" href="/maintenance">ТО</a>
    <a class="nav-link" href="/defects">Дефекты</a>
    <a class="nav-link active" href="/studs">Шпильки</a>
    <a class="nav-link" href="/analytics">Аналитика</a>
    <a class="nav-link" href="/workers">Сотрудники</a>
    <a class="nav-link" href="/explorer">Обзор</a>
    <a class="nav-link" href="/admin">Редактор</a>
    <a class="nav-link" href="/history">Журнал</a>
    <button class="btn-theme" id="themeToggle" type="button" aria-label="Переключить тему">☀</button>
  </div>
</nav>

<div class="sm-wide">
  <h1 class="sm-sr">Шпильки — визуализация</h1>
  <div class="sm-row">
    <nav class="sp-tabs" role="tablist" aria-label="Шпильки">
      <a role="tab" href="/studs#rec" aria-selected="false">Записать</a>
      <a role="tab" href="/studs#log" aria-selected="false">Журнал</a>
      <a role="tab" href="/studs/map" aria-selected="true" aria-current="page">Визуализация</a>
    </nav>
    <div class="sm-bar" id="smUpload" hidden>
      <input type="file" id="smFile" accept=".xlsx,.xlsm" hidden>
      <button class="btn btn-ghost btn-sm" id="smBtn" type="button">↻ Обновить реестр</button>
    </div>
  </div>
  <div class="sm-msg" id="smMsg" role="status" aria-live="polite"></div>
  <div id="smBox"></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fmtDate = (s) => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
  const frame = () => {
    const box = $('smBox');
    if (box.querySelector('iframe')) { box.querySelector('iframe').contentWindow.location.reload(); return; }
    const f = document.createElement('iframe');
    f.className = 'sm-frame'; f.title = 'Карта дефектов шпилек'; f.allow = 'fullscreen'; f.allowFullscreen = true; // кнопка «во весь экран» в карте
    f.src = '/studs/map/app/';
    box.replaceChildren(f);
  };
  async function load() {
    let st;
    try { const r = await fetch('/api/stud-map/status'); st = await r.json(); } catch (e) { $('smMsg').textContent = 'Нет связи с сервером'; return; }
    $('smUpload').hidden = !st.can_upload;
    $('smBtn').textContent = st.has_data ? '↻ Обновить реестр' : 'Загрузить реестр (xlsx)';
    $('smBtn').title = (st.has_data
      ? 'Сейчас на карте: ' + (st.source || '') + (st.updated ? ' · обновлено ' + fmtDate(st.updated) : '') + (st.updated_by ? ' · ' + st.updated_by : '')
      : 'Данных на карте ещё нет') + '\nВыберите новую версию Stud_Defect_Register_BS_rev….xlsx — карта пересчитается сразу.';
    if (!st.has_schemes) {
      $('smBox').innerHTML = '<div class="card sm-empty">Схемы карты ещё не установлены на сервере: папка <b>data\\stud_map</b> (body, img, parts, body.json, views.json). См. docs/STUD_MAP.md.</div>';
      return;
    }
    if (!st.has_data) {
      $('smBox').innerHTML = '<div class="card sm-empty">Данных пока нет. ' + (st.can_upload ? 'Нажмите «Загрузить реестр (xlsx)» справа вверху.' : 'Реестр загружает WeldTeam.') + '</div>';
      return;
    }
    frame();
  }
  $('smBtn').onclick = () => $('smFile').click();
  $('smFile').onchange = async () => {
    const file = $('smFile').files[0]; if (!file) return;
    const fd = new FormData(); fd.append('file', file);
    $('smBtn').disabled = true; $('smMsg').className = 'sm-msg'; $('smMsg').textContent = 'Загружаю ' + file.name + '…';
    try {
      const r = await fetch('/api/stud-map/register', { method: 'POST', body: fd });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.status !== 'ok') throw new Error(j.message || ('Ошибка ' + r.status));
      $('smMsg').textContent = 'Готово: ' + (j.notes || []).join('; ');
      await load();
    } catch (e) {
      $('smMsg').className = 'sm-msg err'; $('smMsg').textContent = 'Не загружено: ' + e.message;
    } finally {
      $('smBtn').disabled = false; $('smFile').value = '';
    }
  };
  load();
})();
</script>
</body>
</html>
