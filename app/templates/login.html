<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · WeldTeam MES</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .authbox{max-width:380px;margin:9vh auto;border:1px solid var(--border);border-radius:14px;padding:26px;background:var(--card)}
    .authbox h1{margin:0 0 4px;font-size:22px}
    .authbox p.sub{margin:0 0 18px;opacity:.65;font-size:13px}
    .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
    .fld label{font-size:12px;opacity:.75}
    .fld input,.fld select{padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:inherit;font-size:14px}
    .btn{width:100%;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;margin-top:4px}
    .err{background:color-mix(in srgb,#c0392b 15%,transparent);border:1px solid #c0392b;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
    .alt{text-align:center;margin-top:14px;font-size:13px}
    .alt a{color:var(--accent)}
  </style>
</head>
<body>
<div class="authbox">
  <h1>WeldTeam MES</h1>
  <p class="sub">Цех BS · вход в систему</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="fld"><label>Логин</label><input name="login" required autofocus autocomplete="username"></div>
    <div class="fld"><label>Пароль</label><input name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn">Войти</button>
  </form>
  <div class="alt">Нет учётной записи? <a href="/register">Зарегистрироваться</a></div>
</div>
</body>
</html>
