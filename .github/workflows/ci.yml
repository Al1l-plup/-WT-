name: CI

on:
  push:
    branches: [DEV, PROD, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # Тесты сами собирают БД из миграций + db/seed.sql — бинарная БД в репозитории не нужна.
        run: pytest -q
